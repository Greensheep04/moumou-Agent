id: s2_tags
title: Fix whitespace and duplicate tag normalization
scenario: debug
goal: Fix tags.py normalize_tags(tags). Strip whitespace, lowercase, discard empty values, and deduplicate preserving
  first occurrence order. Inputs are strings. Do not mutate the input list or rename the function.
acceptance:
- kind: command
  target: python3 -c "import tags; x=['  Blue ','RED','blue','','  ','Red','green']; before=x[:]; assert tags.normalize_tags(x)==['blue','red','green'];
    assert x==before; assert tags.normalize_tags([])==[]; assert tags.normalize_tags([' X ','x','Y'])==['x','y']"
  expect: '0'
  timeout_s: 30
budget:
  max_steps: 35
  max_wall_s: 600
  max_retries: 1
human:
  default: approve
repeats: 3
tags:
- debug
notes: Self-built task. Offline acceptance probes are not model performance scores.
setup:
  tags.py: "def normalize_tags(tags):\n    return [tag.lower() for tag in tags]\n"
